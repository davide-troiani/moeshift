name: Feature request
description: Suggest an improvement to MoEShift on Apple Silicon.
title: "[Request]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: "Describe your use case and any workaround you use today. Search existing requests first."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested improvement
      description: "Explain the behavior you would like. Implementation details are optional."
    validations:
      required: true
